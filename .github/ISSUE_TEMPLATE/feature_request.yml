name: Feature request
description: A concrete change you want built
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for a specific, buildable change. If you have a broader concept
        or open question that is not yet a concrete change, use the
        Idea / discussion template instead.
  - type: input
    id: component
    attributes:
      label: Target component
      description: Which device or repo would this change land in?
      placeholder: "e.g. OpenMuscle-FlexGrid (hardware), OpenMuscle-Software (pipeline)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what does it make possible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change you want. For hardware, note connectors, pinouts, or board impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you prefer this one.
    validations:
      required: false
  - type: dropdown
    id: offer
    attributes:
      label: Would you like to implement this?
      description: Idea-only is welcome. You will be credited either way.
      options:
        - "Idea only, someone else can build it"
        - "I would like to build it"
        - "Not sure yet"
    validations:
      required: false
