name: Bug report
description: Something is broken in hardware, firmware, or software
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. File it on the repo that owns the broken
        part (for example a FlexGrid PCB issue goes on OpenMuscle-FlexGrid, a
        firmware issue on FlexGridV3-Firmware). If you are unsure which repo,
        open it on the Hub and a maintainer will route it.
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Which device, board revision, firmware version, or tool?
      placeholder: "e.g. FlexGrid V3 rigid PCB / FlexGridV3-Firmware v3.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce this?
      placeholder: |
        1. Flash firmware ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hardware revision, firmware version, host OS, toolchain, anything relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or photos
      description: Serial output, error messages, or photos of the hardware. Drag files in.
    validations:
      required: false
